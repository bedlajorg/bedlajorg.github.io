name: CV PDF

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Print site to PDF
        run: scripts/build-pdf.sh _site Jan_Bednar_CV.pdf

      - uses: actions/upload-artifact@v7
        with:
          # Single file uploaded as-is, so the artifact is the PDF itself (not a zip);
          # the artifact name is then taken from the file name.
          path: Jan_Bednar_CV.pdf
          archive: false
          if-no-files-found: error
