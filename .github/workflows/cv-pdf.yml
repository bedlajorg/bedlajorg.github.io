name: CV PDF

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Print site to PDF
        run: scripts/build-pdf.sh _site Jan_Bednar_CV.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: Jan_Bednar_CV
          path: Jan_Bednar_CV.pdf
          if-no-files-found: error
