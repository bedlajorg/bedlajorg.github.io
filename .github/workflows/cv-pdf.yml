name: CV PDF

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to (re)create the "latest" release
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Print site to PDF
        run: scripts/build-pdf.sh _site Jan_Bednar_CV.pdf

      - uses: actions/upload-artifact@v7
        with:
          # Single file uploaded as-is, so the artifact is the PDF itself (not a zip);
          # the artifact name is then taken from the file name.
          path: Jan_Bednar_CV.pdf
          archive: false
          if-no-files-found: error

      # Permanent public link:
      # https://github.com/bedlajorg/bedlajorg.github.io/releases/latest/download/Jan_Bednar_CV.pdf
      # The release is recreated on every push so the "latest" tag follows master.
      - name: Publish PDF to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Jan_Bednar_CV.pdf \
            --title "Životopis (aktuální)" \
            --notes "Automaticky vygenerované PDF z commitu ${GITHUB_SHA}." \
            --latest
